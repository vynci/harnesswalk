id: sports
title: The Copperline Community League
domain: sports
summary: A volunteer help desk for an amateur football league, where fixture, table and player lookups
  are routed to the cheapest model for the phrasing step.
tier: domain
profile: grounded
feature: Cheap model routing for lookups
demonstrates:
  id: router
  nodes:
  - model_layer
  - router
  summary: 'The first model call of a lookup turn picks the tool, so the router uses the default rule.
    The call after a read-only tool result only has to phrase the row, so the router''s lookup rule sends
    it to the cheapest configured model, and rules questions answered from knowledge stay on default.

    '
