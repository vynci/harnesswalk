# Pack overrides for the input guardrails (spec/contracts/guardrail.md). The patterns
# replace the defaults for this pack, so the US SSN and Canadian SIN ones are kept.
# Investor account numbers (LP-1234-5678-90) are national ids for this pack.
pii:
  national_id:
    patterns:
    - name: us_ssn
      regex: (?<![\d-])\d{3}-\d{2}-\d{4}(?![\d-])
      luhn: false
    - name: ca_sin
      regex: (?<![\d-])\d{3}[ -]\d{3}[ -]\d{3}(?![\d-])
      luhn: true
    - name: investor_account_number
      regex: (?<![A-Za-z0-9-])LP-\d{4}-\d{4}-\d{2}(?![A-Za-z0-9-])
      luhn: false
