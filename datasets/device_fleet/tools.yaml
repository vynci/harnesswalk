  timeout_ms: 2000
  idempotent: true
  pure: true
  audit: { before: get_asset_status }
  parameters:
    type: object
    additionalProperties: false
    required: [asset_id]
    properties:
      asset_id: { type: string, pattern: "^KW-[0-9]{4}$", description: "Asset id, for example KW-0027." }
  table:
