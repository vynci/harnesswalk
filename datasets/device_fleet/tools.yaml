# Bundled data for the Kestrelway Field Services pack: every table below is fictional.
# Each table maps a lookup key to the row a tool returns; `missing` is the row for an unknown key.
# The shapes follow a real fleet platform's API (status, insights, driver events, the inbox,
# commands); the pack's "now" is 2026-10-23T09:00:00Z. Commands are split into one tool per
# risk level, because policy decides per tool: a harmless OBD scan, a reboot only admins may
# run, and three irreversible actions that wait for a human.
- name: list_assets
  description: List the fleet's assets with online state, last seen time, OBD tier and the driving-rule sync status of each.
  action_class: read
  timeout_ms: 2000
  idempotent: true
  pure: true
  parameters:
    type: object
    additionalProperties: false
    required: [fleet_id]
    properties:
      fleet_id: { type: string, pattern: "^[a-z]{3,20}$", description: "The fleet id, kestrelway." }
  table:
    kestrelway:
      fleet_id: kestrelway
      as_of: "2026-10-23T09:00:00Z"
      assets:
      - { asset_id: KW-0002, name: Shop Pickup 2, type: pickup, plate: KW 2D 417, online: true, last_seen: "2026-10-23T08:57:40Z", obd_tier: full, rate_hz: 1, rule_sync: ok }
