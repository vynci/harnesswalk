- name: obd_scan
  description: Ask an online OBD-equipped device to read the vehicle's OBD data now (rate limited to one scan per 60 s per device).
  action_class: write
  timeout_ms: 2000
  idempotent: true
  pure: true
  parameters:
    type: object
    additionalProperties: false
    required: [asset_id]
    properties:
      asset_id: { type: string, pattern: "^KW-[0-9]{4}$", description: "Asset id, for example KW-0002." }
  table:
