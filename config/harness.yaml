# harnesswalk runtime configuration. Keys follow spec/contracts/*.md.
# Environment variables (HARNESSWALK_*) override a few of these; see harnesswalk/config/loader.py.
mode: dev                       # dev | public | private (env HARNESSWALK_MODE)
dataset: _starter               # active dataset pack under datasets/

project:
  repo_url: https://github.com/vynci/harnesswalk   # the lessons' code links (GET /v1/capabilities repo_url)

# P6: public mode (spec/contracts/http_api.md, "P6 additions"). Env: HARNESSWALK_MODE=public,
# HARNESSWALK_SECRET (required: the server refuses to start in public mode without it),
# HARNESSWALK_PUBLIC_BUDGET_USD (overrides hosted_budget_usd_per_day). The site's own model key
# is the provider's key variable (ANTHROPIC_API_KEY), never a value in a file.
public:
  models: [hosted-haiku, hosted-sonnet, fake-small]   # the only aliases a public turn may use
  default_model: hosted-haiku   # what a public turn uses without a hint (the router's `public` rule)
  hosted_budget_usd_per_day: 15 # shared by every priced alias, per UTC day; a BYO key bypasses it
  session_ttl_s: 7200           # anonymous tenant lifetime; then the sweeper deletes its rows
  sweep_interval_s: 300         # TTL sweeper cadence in the server; 0 disables it (tests)
  rate_limit_max_keys: 10000    # bound on the in-memory rate-limit table (oldest evicted)
  cookie_secure: auto           # auto (Secure when the request came over HTTPS), always, never
  fake_fixture: public_demo     # fake-small's fixture in public mode unless one is given (config/fixtures)
  # P6 review: what one client can hold at once (http_api.md, P6 additions).
  max_running_hosted_turns: 10        # site-paid turns on a priced alias running on the server
  max_running_hosted_turns_per_ip: 2  # ... and per client (IPv6 by /64)
  max_streams_per_ip: 4               # SSE streams per client, before gateway.max_open_streams
  max_streams_per_tenant: 4           # SSE streams per anonymous tenant
  max_ops_streams: 20                 # GET /v1/events streams on the server (its own pool)
  max_stream_s: 600                   # an SSE stream closes after this; EventSource reconnects
  max_turn_wall_s: 600                # a public turn is cancelled after this, paused time included
  creations_per_ip_per_hour: 60       # new tenants and POST /v1/sessions per client per hour

logging:
  format: text                  # text | json (env HARNESSWALK_LOG_FORMAT): one JSON line per request

gateway:
  channels: [web]
  max_body_bytes: 65536         # request size limit, checked before the body is parsed
  max_message_chars: 32000      # hard transport cap; input_guardrails.size is the policy limit
  rate_limit: { per_ip_per_hour: 30, per_tenant_per_hour: 120 }
  max_open_streams: 50          # SSE streams open at once (every mode); the next one is a 429
  trust_proxy: false            # env HARNESSWALK_TRUST_PROXY=1: client IP from the proxy headers
  dev_tenant: dev
  allow_tenant_header: true     # X-Harnesswalk-Tenant, honoured in dev mode only
  stream_reply_chars: 24        # > 0 emits message_delta chunks of this size in the reply span (0 turns it off)
  turn_state_max: 500           # finished turns kept in memory for control calls; older ones are
  turn_state_ttl_seconds: 3600  # evicted (summaries and replay read the trace store, not memory)
  shutdown_grace_s: 2           # Ctrl+C ends open event streams at once; any left are cut after this

input_guardrails:
  enabled: true
  checks: [control, size, pii, injection]
  size: { max_chars: 8000 }
  pii:
    kinds: [email, phone, card, national_id]
    action: redact                # redact (numbered placeholders) or block
    restore_modes: [dev]          # modes whose reply gets the user's own values back
    names: { enabled: false }     # cue-based name detection ("my name is ...")
    # national_id.patterns default to US SSN and Canadian SIN; a pack can set its own in
    # datasets/<pack>/guardrails.yaml
  injection:
    block_threshold: 0.8
    action: { dev: warn, private: block, public: block }
    classifier: { enabled: false }   # a model's score on top of the heuristics (router step classify)

output_guardrails:
  enabled: true
  checks: [schema, content, length, citations, pii]
  max_chars: 12000              # longer answers are repaired by truncation
  citations: { required: true, on_missing: repair, block_public: false }
  content: { blocklist: [] }
  pii: { action: repair }       # leaked personal data in a reply: repair (redact) or block

loop:
  max_steps: 8
  budget_tokens: 16000
  budget_usd: 0.05
  timeout_s: 120
  stuck_repeats: 3
  final_call_on_exit: true
  notices:
    budget_tokens: I stopped because this turn used its token budget. Try a narrower question.
    budget_usd: I stopped because this turn used its cost budget. Try a narrower question.
    budget_tool_calls: I stopped because this turn used its tool-call budget. Try a narrower question.
    timeout: I stopped because this turn ran out of time. Please try again.
    interrupted: I stopped because the turn was interrupted.
    max_steps: I stopped after the maximum number of steps without reaching an answer.
    stuck: I stopped because I was repeating the same tool call without progress.
    error: Something went wrong while answering. The trace has the details.
    budget_exhausted: Today's shared budget for Claude models is spent, so the rest of this turn ran on the fake model. It resets at 00:00 UTC.

tools:
  builtins: [calculator, read_skill, remember, read_doc]
  max_observation_chars: 4000

sandbox:
  level: subprocess             # inprocess | subprocess; public mode always runs inprocess
  max_timeout_ms: 10000
  subprocess:
    memory_mb: 256
    output_cap_bytes: 65536
    workdir: data/sandbox       # one directory per turn under here, removed when the turn ends
    os_jail: auto               # auto (sandbox-exec on macOS, unshare on Linux) or off

storage:
  vectors: sqlite               # sqlite (brute-force cosine) | pgvector (POSTGRES_* or HARNESSWALK_DATABASE_URL)

trace:
  backend: sqlite
  sqlite_path: data/trace.db
  validate_events: true         # validate every event against spec/events.schema.json
  capture_content: true

audit:
  backend: sqlite
  sqlite_path: data/audit.db
  record_read_allows: false
  export_max: 5000              # GET /v1/audit page ceiling

# P5: dataset packs (spec/contracts/http_api.md, "P5 additions"). A session picks one with
# POST /v1/sessions {pack}; `dataset` above is the default.
packs:
  roots: [datasets]             # directories whose subdirectories are packs (pack.yaml or system_prompt.md)

# P5: the eval gate on release (spec/contracts/release.md, "P5 additions"). POST /v1/releases
# runs the pack's golden set on the working set first and refuses the release (409
# gate_failed) below min_pass_rate; {force: true} skips it in dev mode, audited.
release:
  gate:
    enabled: true
    suite: golden
    min_pass_rate: 1.0
    packs: all                  # all, or a list of pack ids whose releases are gated

# 0.2.0: eval case turns (golden, judge and model runs, the release gate, the tuning loop's
# runs). A run plays many long turns in one scratch tenant, so its turns get a budget of their
# own over the tenant's (`policy.budgets`; the `_per_turn` keys here replace the loop's own
# budget too), and a model call may take longer than a chat turn's (a cold local model).
evals:
  case_budget: { tokens_per_turn: 200000, tokens_per_hour: 5000000, tool_calls_per_hour: 5000 }
  model_timeout_s: 180
