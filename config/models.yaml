# Model layer: providers, model aliases, prices and router rules.
# See spec/contracts/model_provider.md and router.md.
# Keys are referenced by environment variable name only, never by value.
providers:
  fake: { fixture: plain_answer }
  # HARNESSWALK_OLLAMA_URL, when set, wins over base_url (a remote Ollama needs no --set).
  ollama: { base_url: http://localhost:11434, base_url_env: HARNESSWALK_OLLAMA_URL, timeout_s: 300 }
  # Hosted providers are off unless selected (HARNESSWALK_PROVIDER) or enabled here, so a key in
  # your shell never turns into a paid fallback by accident.
  anthropic: { enabled: false, base_url: https://api.anthropic.com, api_key_env: ANTHROPIC_API_KEY, timeout_s: 60 }
  openai_compatible: { enabled: false, base_url: "", base_url_env: OPENAI_BASE_URL, api_key_env: OPENAI_API_KEY, timeout_s: 60 }

models:
  fake-small:   { provider: fake, label: Fake model (scripted), context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true }
  local-8b:     { provider: ollama, name: "llama3.1:8b", context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true }
  local-small:  { provider: ollama, name: "llama3.2:3b", context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true }
  # The model ladder (docs/scorecard.md): small local models an eval run pins with --model.
  # Thinking off, as for the hosted aliases: the harness does not replay thinking.
  local-2b:     { provider: ollama, name: "qwen3.5:2b", context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true, params: { think: false } }
  local-4b:     { provider: ollama, name: "qwen3.5:4b", context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true, params: { think: false } }
  local-9b:     { provider: ollama, name: "qwen3.5:9b", context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true, params: { think: false } }
  local-e4b:    { provider: ollama, name: "gemma4:e4b", context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true, params: { think: false } }
  # 0.2.0, the tuning loop (spec/contracts/tuning.md): the in-family local teacher (in no router
  # rule), and a scripted student for the fake trainer's loop: it asks for approval in prose
  # instead of calling a write tool, the failure a tuned model fixes.
  local-27b:    { provider: ollama, name: "qwen3.5:27b", context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true, params: { think: false } }
  # The tuned student of docs/tuning.md: model/approvals_4b, the Q4_K_M merge a homelab tune run
  # created in Ollama (`ollama create`), so it answers only where that tag exists. In no router
  # rule: `tune promote` routes it through router.canary in the release store.
  tuned-approvals-4b: { provider: ollama, name: "hw-approvals-4b:tr_2", label: Tuned approvals_4b (qwen3.5:4b LoRA), context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true, params: { think: false } }
  fake-student: { provider: fake, label: Fake student (asks first), context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true, params: { fake_style: ask_first } }
  # Pinned Anthropic ids (PLAN section 13). Prices per million tokens, first-party API, prompts
  # up to 100K tokens for Haiku. The harness does not replay thinking blocks, so each model
  # runs with a thinking mode that needs none.
  hosted-haiku:  { provider: anthropic, name: claude-haiku-5-5, label: Claude Haiku 5.5, context_tokens: 1000000, price_in_per_mtok: 0.10, price_out_per_mtok: 0.50, tools: true, params: { thinking: { type: disabled } } }
  hosted-sonnet: { provider: anthropic, name: claude-sonnet-5-5, label: Claude Sonnet 5.5, context_tokens: 1000000, price_in_per_mtok: 2.0, price_out_per_mtok: 10.0, tools: true, modalities: [text, image], params: { thinking: { type: between_tools } } }
  compat-default: { provider: openai_compatible, name: default, context_tokens: 32000, tools: true }
  local-embed:  { provider: ollama, name: nomic-embed-text, embedding: true }

# With the fake provider there is no summarize model, so compaction falls back to truncation.
# The router picks the first alias in `use` whose provider is configured. Setting
# HARNESSWALK_PROVIDER configures that provider only, so the same rules serve every provider.
router:
  health_check_s: 30
  cost: { tight_fraction: 0.75 }        # a turn past this share of its dollar budget is cost: low
  # Cascade (off by default): a low-confidence answer from a local model is retried on the next
  # hosted alias in the rule's list. See spec/contracts/router.md.
  cascade: { enabled: false, min_confidence: 0.5, local_providers: [ollama, fake] }
  rules:
    # Public mode (P6): `public.models` from config/harness.yaml, the default model first. First,
    # so every step of a public turn (summarize, classify, judge too) stays on the allowlist; a
    # turn's `model` hint picks among them, and priced aliases drop out when the shared daily
    # budget is spent (spec/contracts/router.md, "P6 additions").
    - { id: public,    when: { mode: public },     use: public.models }
    - { id: vision,    when: { modality: image },  use: [hosted-sonnet] }
    - { id: summarize, when: { step: summarize },  use: [local-small, local-8b, hosted-haiku, compat-default] }
    - { id: classify,  when: { step: classify },   use: [hosted-haiku, local-small] }
    - { id: judge,     when: { step: judge },      use: [hosted-haiku, local-8b] }
    - { id: cheap,     when: { cost: low },        use: [local-8b, hosted-haiku, compat-default, fake-small], max_price_out_per_mtok: 1.0 }
    - { id: high_risk, when: { risk: high },       use: [hosted-sonnet, local-8b, hosted-haiku, compat-default, fake-small] }
    # A call after a read-only tool result only phrases the row, so the cheapest configured model
    # does it (the sports pack's golden set asserts this rule). After a non-read tool, risk is high.
    - { id: lookup,    when: { step: after_tool, risk: low }, use: [local-8b, hosted-haiku, compat-default, fake-small], max_price_out_per_mtok: 1.0 }
    - { id: default,   when: {},                   use: [local-8b, hosted-sonnet, hosted-haiku, compat-default, fake-small] }

model_layer:
  timeout_s: 60
  max_output_tokens: 1024
  cache: none
