name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Golden suite (fake provider; the judge is never configured in CI)
        run: uv run harnesswalk eval _starter --suite golden
        env:
          HARNESSWALK_DATA_DIR: ${{ runner.temp }}/harnesswalk-eval

  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Validate every dataset pack (schema, sizes, fixtures, tools, PII, provenance)
        run: uv run harnesswalk packs validate
      - name: Golden suite of every pack (fake provider)
        run: |
          for pack in $(uv run harnesswalk packs list --json | python3 -c 'import json, sys; print(" ".join(p["id"] for p in json.load(sys.stdin)))'); do
            echo "::group::$pack"
            HARNESSWALK_DATA_DIR="$RUNNER_TEMP/eval-$pack" uv run harnesswalk eval "$pack" --suite golden
            echo "::endgroup::"
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json  # pnpm version from packageManager
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install the harness
        run: uv sync --locked
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the web app and Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Smoke tests against the mock build
        working-directory: web
        run: pnpm test:e2e
      - name: End to end against the real API (fake provider)
        working-directory: web
        # Playwright builds the app, starts `harnesswalk serve --provider fake` on a scratch
        # port and stops it afterwards (playwright.live.config.ts).
        run: pnpm test:e2e:live

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel (the bundle hook on, as in the release)
        env:
          HATCH_BUILD_HOOK_ENABLE_CUSTOM: "1"
        run: |
          uv build --sdist --out-dir dist
          uv build --wheel --out-dir dist
      - name: Install the wheel in a clean venv outside the repo and run it (fake provider)
        run: uv run --no-project python tools/wheel_smoke.py dist/*.whl

  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0  # the check bundles the history and clones it inside the container
      - name: README Quickstart, make test and the web build in a clean python:3.12 container
        run: tools/fresh_clone_check.sh
