name: deploy

# harnesswalk.vynci.dev (deploy/README.md). After `ci` passes on a push to main: the web app to
# S3 + CloudFront, the api image to ECR and onto the origin, then a smoke against the domain.
# A manual run with a tag rolls the origin back to that image instead.
#
# No secrets live here: the job assumes the HarnesswalkCi deploy role with GitHub OIDC, and the
# names come from repository variables (Settings > Secrets and variables > Actions > Variables):
#   HARNESSWALK_DEPLOY_ROLE_ARN   HarnesswalkCi output DeployRoleArn
#   HARNESSWALK_WEB_BUCKET        HarnesswalkEdge output WebBucketName
#   HARNESSWALK_DISTRIBUTION_ID   HarnesswalkEdge output DistributionId
#   HARNESSWALK_INSTANCE_ID       HarnesswalkOrigin output InstanceId
#   HARNESSWALK_ECR_REPOSITORY    HarnesswalkCi output RepositoryUri
# The role trusts only refs/heads/main of this repository.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Roll the origin back to this image tag (a git sha from ECR). Empty: deploy main."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  HARNESSWALK_WEB_BUCKET: ${{ vars.HARNESSWALK_WEB_BUCKET }}
  HARNESSWALK_DISTRIBUTION_ID: ${{ vars.HARNESSWALK_DISTRIBUTION_ID }}
  HARNESSWALK_INSTANCE_ID: ${{ vars.HARNESSWALK_INSTANCE_ID }}
  HARNESSWALK_ECR_REPOSITORY: ${{ vars.HARNESSWALK_ECR_REPOSITORY }}

jobs:
  gate:
    # A push to main whose ci run passed, or a manual run on main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      rollback: ${{ steps.pick.outputs.rollback }}
    steps:
      - id: pick
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]] || { echo "tag must be a git sha, got: $TAG" >&2; exit 1; }
            echo "rollback=$TAG" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: gate
    if: needs.gate.outputs.rollback == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.HARNESSWALK_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: harnesswalk-web-${{ github.run_id }}
      - name: Build and publish the web app
        run: deploy/aws/scripts/deploy-web.sh

  api:
    needs: gate
    if: needs.gate.outputs.rollback == ''
    # Native arm64 runner: the origin is a t4g (Graviton), so no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.HARNESSWALK_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: harnesswalk-api-${{ github.run_id }}
      - name: Build and push the image (tag = git sha)
        run: deploy/aws/scripts/build-push.sh
      - name: Roll the origin onto it
        run: deploy/aws/scripts/deploy-origin.sh

  rollback:
    needs: gate
    if: needs.gate.outputs.rollback != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.HARNESSWALK_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: harnesswalk-rollback-${{ github.run_id }}
      - name: Roll the origin back
        env:
          TAG: ${{ needs.gate.outputs.rollback }}
        run: deploy/aws/scripts/rollback.sh "$TAG"

  smoke:
    needs: [gate, web, api, rollback]
    if: >-
      always() && needs.gate.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Smoke https://harnesswalk.vynci.dev
        run: deploy/aws/scripts/smoke.sh
