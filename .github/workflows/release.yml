name: release

# A tag v<version> (made by the owner after `make release-prep VERSION=<version>`) builds the
# sdist and the wheel with the web app inside, proves the wheel in a clean venv, publishes it to
# PyPI with trusted publishing, pushes a multi-arch image to ghcr.io, and creates the GitHub
# Release with the changelog section. Steps and the one-time setup: docs/RELEASING.md.
# Every action is pinned to a full commit SHA (the comment names the release).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vynci/harnesswalk

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: The tag names the project version
        id: version
        run: |
          uv run --no-project python tools/release.py check-tag "$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ [0-9](a|b|rc)[0-9]+$ ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: The changelog has a section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p notes
          uv run --no-project python tools/release.py notes "$VERSION" > notes/release-notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "pip install harnesswalk==$VERSION && harnesswalk serve --provider fake"
            echo "docker run --rm -p 8000:8000 -e HARNESSWALK_PROVIDER=fake $IMAGE:$VERSION"
            echo '```'
          } >> notes/release-notes.md
          cat notes/release-notes.md
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web app (it ships inside the wheel)
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Build the sdist and the wheel
        env:
          HATCH_BUILD_HOOK_ENABLE_CUSTOM: "1"  # tools/hatch_build.py bundles config, spec, packs, lessons
          HARNESSWALK_BUNDLE_WEB: "1"          # and web/dist; a missing app fails the build
        run: |
          uv build --sdist --out-dir dist
          uv build --wheel --out-dir dist
          uvx twine check --strict dist/*
      - name: Install the wheel in a clean venv and run it on the fake provider
        run: uv run --no-project python tools/wheel_smoke.py dist/*.whl --web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          path: notes/

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    # Off until the owner has set up the trusted publisher (docs/RELEASING.md): set the
    # repository variable PYPI_PUBLISH to "true" to turn it on. Skipped, not failed, before that.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/harnesswalk/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    name: Push the image to ghcr.io (linux/amd64, linux/arm64)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # 0.1.0 and 0.1 on every release; latest only on a final release (not a, b or rc).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.build.outputs.prerelease == 'false' }}
          flavor: |
            latest=${{ needs.build.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=harnesswalk
            org.opencontainers.image.description=Walk through an AI harness, one node at a time: the reference harness and its web app
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create the GitHub Release
    # Notes and files land on the release even when PyPI refuses (publisher not set up yet);
    # the pypi job can be re-run on its own.
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes
          path: notes/
      - name: Release ${{ github.ref_name }} with the changelog section and the distributions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          # The owner makes the release in the GitHub UI (that is what deploys the site), so it
          # usually exists already: then attach the distributions and fill in the notes. A tag
          # pushed by hand without a release gets one created here (it publishes packages only).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Harnesswalk $VERSION" --notes-file notes/release-notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Harnesswalk $VERSION" \
              --notes-file notes/release-notes.md \
              --verify-tag "${flags[@]}"
          fi
