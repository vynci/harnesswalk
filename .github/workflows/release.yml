name: release

# A tag v<version> (made by the owner after `make release-prep VERSION=<version>`) builds the
# sdist and the wheel with the web app inside, proves the wheel in a clean venv, publishes it to
# PyPI with trusted publishing, pushes a multi-arch image to ghcr.io, and creates the GitHub
# Release with the changelog section. Steps and the one-time setup: docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vynci/harnesswalk

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: The tag names the project version
        id: version
        run: |
          uv run --no-project python tools/release.py check-tag "$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ [0-9](a|b|rc)[0-9]+$ ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: The changelog has a section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p notes
          uv run --no-project python tools/release.py notes "$VERSION" > notes/release-notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "pip install harnesswalk==$VERSION && harnesswalk serve --provider fake"
            echo "docker run --rm -p 8000:8000 -e HARNESSWALK_PROVIDER=fake $IMAGE:$VERSION"
            echo '```'
          } >> notes/release-notes.md
          cat notes/release-notes.md
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web app (it ships inside the wheel)
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - name: Build the sdist and the wheel
        env:
          HATCH_BUILD_HOOK_ENABLE_CUSTOM: "1"  # tools/hatch_build.py bundles config, spec, packs, lessons
          HARNESSWALK_BUNDLE_WEB: "1"          # and web/dist; a missing app fails the build
        run: |
          uv build --sdist --out-dir dist
          uv build --wheel --out-dir dist
          uvx twine check --strict dist/*
      - name: Install the wheel in a clean venv and run it on the fake provider
        run: uv run --no-project python tools/wheel_smoke.py dist/*.whl --web
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes/

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/harnesswalk/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: Push the image to ghcr.io (linux/amd64, linux/arm64)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 0.1.0 and 0.1 on every release; latest only on a final release (not a, b or rc).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.build.outputs.prerelease == 'false' }}
          flavor: |
            latest=${{ needs.build.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=harnesswalk
            org.opencontainers.image.description=Walk through an AI harness, one node at a time: the reference harness and its web app
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create the GitHub Release
    needs: [build, pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes/
      - name: Release ${{ github.ref_name }} with the changelog section and the distributions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "harnesswalk $VERSION" \
            --notes-file notes/release-notes.md \
            --verify-tag "${flags[@]}"
