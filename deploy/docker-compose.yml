# harnesswalk compose stack.
#
#   docker compose -f deploy/docker-compose.yml --profile dev up      # api + postgres + ollama on this machine
#   docker compose -f deploy/docker-compose.yml --profile homelab up  # api + postgres, model served elsewhere
#   docker compose --env-file compose.env --profile prod up -d        # the box behind harnesswalk.vynci.dev
#   make prod-up                                                      # the prod profile on a laptop
#
# Image tags are pinned. No secrets live in this file; values come from the environment.
# The api image also builds web/ (a multi-stage deploy/api.Dockerfile) and serves it at
# http://127.0.0.1:8000/ once web/ has a package.json.
# The api keeps its records in SQLite under /data and, since P3, the vectors of the semantic,
# episodic and knowledge stores in Postgres with pgvector (HARNESSWALK_VECTORS=sqlite opts out).
name: harnesswalk

services:
  api:
    profiles: [dev, homelab]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      HARNESSWALK_MODE: ${HARNESSWALK_MODE:-dev}
      HARNESSWALK_PROVIDER: ${HARNESSWALK_PROVIDER:-ollama}
      HARNESSWALK_FIXTURE: ${HARNESSWALK_FIXTURE:-}
      HARNESSWALK_OLLAMA_URL: ${HARNESSWALK_OLLAMA_URL:-http://ollama:11434}
      HARNESSWALK_DATA_DIR: /data
      HARNESSWALK_DATABASE_URL: postgresql://harnesswalk:${POSTGRES_PASSWORD:-harnesswalk-local}@postgres:5432/harnesswalk
      # Vectors for semantic, episodic and knowledge: pgvector in compose (sqlite to opt out).
      HARNESSWALK_VECTORS: ${HARNESSWALK_VECTORS:-pgvector}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - harness-data:/data

  postgres:
    profiles: [dev, homelab]
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: harnesswalk
      POSTGRES_DB: harnesswalk
      # Local-only default for the learner path. Set POSTGRES_PASSWORD for anything else.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harnesswalk-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harnesswalk -d harnesswalk"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    profiles: [dev]
    image: ollama/ollama:0.40.8
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  # --- prod profile: the EC2 origin behind CloudFront (deploy/README.md) -----------------------
  # The box runs it from /srv/harnesswalk with compose.env written from SSM at boot
  # (HARNESSWALK_IMAGE, HARNESSWALK_SECRET, ANTHROPIC_API_KEY, ORIGIN_VERIFY). The compose file
  # and Caddyfile come out of the image being deployed, so they always match it.
  # Locally: make prod-up (deploy/docker-compose.prod-local.yml on top of this file).
  api-prod:
    profiles: [prod]
    # compose.env sets the ECR image; the default is the image make prod-up builds. (No `:?`
    # guards in this file: compose interpolates every profile, so one would break `--profile dev`.)
    image: ${HARNESSWALK_IMAGE:-harnesswalk-api:local}
    # Caddy proxies to api:8000, the same name the dev profile uses.
    networks:
      default:
        aliases: [api]
    environment:
      HARNESSWALK_MODE: public
      HARNESSWALK_DATA_DIR: /data
      # Required: in public mode the API refuses to start without it.
      HARNESSWALK_SECRET: ${HARNESSWALK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HARNESSWALK_TRUST_PROXY: "1"
      HARNESSWALK_LOG_FORMAT: json
      HARNESSWALK_VECTORS: sqlite
      # Optional; empty means the config value (public.hosted_budget_usd_per_day).
      HARNESSWALK_PUBLIC_BUDGET_USD: ${HARNESSWALK_PUBLIC_BUDGET_USD:-}
      # Empty on the box (the configured router); the local run sets fake.
      HARNESSWALK_PROVIDER: ${HARNESSWALK_PROVIDER:-}
      HARNESSWALK_FIXTURE: ${HARNESSWALK_FIXTURE:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /srv/harnesswalk/data:/data
    mem_limit: 1536m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      # A JSON body, not just a 200: the API's SPA fallback answers unknown paths with index.html.
      test: ["CMD", "python", "-c", "import json, urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: ${HARNESSWALK_LOG_GROUP:-/harnesswalk/prod}
        awslogs-stream: api
        mode: non-blocking
        max-buffer-size: 4m

  caddy:
    profiles: [prod]
    image: caddy:2.11.7-alpine
    depends_on:
      api-prod:
        condition: service_started
    environment:
      ORIGIN_VERIFY: ${ORIGIN_VERIFY:-}
      HARNESSWALK_ORIGIN_HOST: ${HARNESSWALK_ORIGIN_HOST:-origin.harnesswalk.vynci.dev}
      CADDY_TLS: ${CADDY_TLS:-tls_acme}
    # Refuse to start without the CloudFront secret: an empty header matcher would let anyone in.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ $${#ORIGIN_VERIFY} -ge 32 ] || { echo "caddy: ORIGIN_VERIFY is missing or shorter than 32 characters" >&2; exit 64; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: ${HARNESSWALK_LOG_GROUP:-/harnesswalk/prod}
        awslogs-stream: caddy
        mode: non-blocking

volumes:
  harness-data:
  pgdata:
  ollama-models:
  # Caddy's certificates and ACME account (prod profile).
  caddy-data:
  caddy-config:
