[project]
name = "harnesswalk"
version = "0.1.1"
description = "Walk through an AI harness, one node at a time: a glass-box agent runtime with a live, steppable systems diagram."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vince Elizaga", email = "hello@vynci.dev" }]
maintainers = [{ name = "Vince Elizaga", email = "hello@vynci.dev" }]
requires-python = ">=3.12"
keywords = ["ai", "agents", "harness", "llm", "education", "observability", "guardrails", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "opentelemetry-sdk>=1.27",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://harnesswalk.vynci.dev"
Source = "https://github.com/vynci/harnesswalk"
Issues = "https://github.com/vynci/harnesswalk/issues"
Changelog = "https://github.com/vynci/harnesswalk/blob/main/CHANGELOG.md"
Documentation = "https://github.com/vynci/harnesswalk/tree/main/lessons"

[project.scripts]
harnesswalk = "harnesswalk.__main__:main"

[project.optional-dependencies]
pgvector = [
    "psycopg[binary]>=3.2",
]
otel = [
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# The wheel is the `harnesswalk` package. An installed harness also needs the repo content it
# reads (config/, spec/, datasets/, lessons/, its own sources for the code peek and, when built,
# web/dist): tools/hatch_build.py bundles them under harnesswalk/_bundle/. The hook is off by
# default so an editable install (uv sync, the Docker image) never loads it; build a wheel with
# `make dist`, which sets HATCH_BUILD_HOOK_ENABLE_CUSTOM=1.
[tool.hatch.build.targets.wheel]
packages = ["harnesswalk"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/hatch_build.py"
enable-by-default = false

[tool.hatch.build.targets.sdist]
include = [
    "/harnesswalk",
    "/config",
    "/spec",
    "/datasets",
    "/lessons",
    "/tools/hatch_build.py",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
