[project]
name = "@@pack@@-harness"
version = "0.1.0"
description = "A @@profile@@ harness for @@title@@, generated by harnesswalk init. No runtime dependency on Harnesswalk."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27", "jsonschema>=4.20", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*", "evals*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".harnesswalk", "tests/conformance/suite"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
