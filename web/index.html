<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="harnesswalk: walk through an AI harness, one node at a time." />
    <title>harnesswalk</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        // Stored as JSON by src/state/persist.ts, so the value is '"dark"', not 'dark'.
        var t = JSON.parse(localStorage.getItem('harnesswalk.theme') || 'null')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
