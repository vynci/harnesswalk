id: approval_resume_after_restart
title: The harness restarts while a turn waits on an approval, and the same turn resumes
spec_version: 0.1.0
fixture: approval_resume_after_restart
two_process: true
turns:
  - send:
      message: Please cancel order A-1002.
    actions:
      - when: { type: node_paused, node_id: approval }
        do: { restart: true }
      - when: { type: node_paused, node_id: approval }
        do: { approval: approve }
    expect:
      path: [gateway, input_guardrails, context_builder, memory, loop, model_layer, tools, policy, audit, approval, audit, audit, model_layer, output_guardrails, gateway, trace]
      statuses: done
      events:
        - { type: approval_requested, node_id: approval, status: waiting, summary: { tool: cancel_order, args_preview: { order_id: A-1002 } } }
        - { type: node_paused, node_id: approval, status: waiting, summary: { reason: approval } }
        - { type: approval_decided, node_id: approval, status: done, summary: { decision: approve } }
        - { type: node_resumed, node_id: approval, status: active }
        - { type: node_exit, node_id: audit, summary: { action: approval_decision, decision: approve } }
        - { type: node_exit, node_id: audit, summary: { action: tool_executed, executed: true } }
        - { type: node_exit, node_id: tools, summary: { tool: cancel_order, outcome: ok, executed: true } }
        - { type: node_exit, node_id: loop, summary: { exit_reason: answer, steps: 2 } }
        - { type: turn_end, status: done, summary: { exit: answered } }
      cost: { input_tokens: 1961, output_tokens: 49 }
      reply_contains: [cancelled]
