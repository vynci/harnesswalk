# Conformance profile: the configuration every implementation runs the suite with.
# Keys follow spec/contracts/*.md. A case may override only the keys listed in
# `overridable` below, through its own `config` map.
spec_version: 0.1.0
mode: dev
tenant_prefix: conformance-          # runner sends X-Harnesswalk-Tenant: conformance-<case id>

models:
  providers:
    fake: { fixture_dir: spec/conformance/fixtures }
  models:
    fake-small: { provider: fake, context_tokens: 32000, price_in_per_mtok: 0, price_out_per_mtok: 0, tools: true }
    # P6: a fake alias with a price (one cent per input token), so the shared hosted budget
    # can run out without a hosted model (public_budget_fall_through).
    fake-priced: { provider: fake, context_tokens: 32000, price_in_per_mtok: 10000, price_out_per_mtok: 0, tools: true }
  router:
    rules:
      # P6: public turns route over `public.models` (default first), as in config/models.yaml.
      - { id: public, when: { mode: public }, use: public.models }
      - { id: default, when: {}, use: [fake-small] }

procedural:
  system_prompt: |
    You are the support assistant for Example Store, a fictional shop used for conformance tests.
    Support hours are 9am to 5pm Eastern, Monday to Friday.
  skills: []

context:
  total_tokens: 16000
  reserve_output_tokens: 1024
  stores: [procedural, session]      # cases that need semantic, episodic or knowledge add them

# The knowledge cases ingest these documents (and no seed facts or events). Hash embeddings,
# so retrieval is the same on every machine.
stores:
  knowledge: { docs_dir: spec/conformance/docs }
  seeds_dir: spec/conformance
  embeddings: { provider: fake }

loop:
  max_steps: 8
  budget_tokens: 100000
  budget_usd: 0
  timeout_s: 30
  stuck_repeats: 3
  final_call_on_exit: true

policy:
  agent:
    allow_tools: [lookup_order, track_shipment, cancel_order, remember, read_doc]
  rules:
    - { id: dev.read.allow, modes: [dev], action_classes: [read], decision: allow }
    - { id: dev.destructive.approve, modes: [dev], action_classes: [destructive], decision: needs_approval }
    - { id: memory.write.propose, modes: [dev, private, public], action_classes: [memory.write], decision: allow }

approval:
  timeout_s: 300

input_guardrails: { enabled: true, checks: [size, pii, injection] }
output_guardrails: { enabled: true, checks: [schema, content, citations] }

tools: spec/conformance/tools.yaml

# P4: the golden set eval runs read (spec/contracts/evaluator.md), the same for any pack.
evals: { golden_path: spec/conformance/golden.jsonl }

# P5: a second pack for the pack cases (spec/conformance/packs/conformance_alt). The profile's
# inline prompt, tools, documents and golden set apply to every pack, so the packs differ only
# in their id, which is all pack_switch needs: tenant data is kept per tenant and pack.
packs: { roots: [datasets, spec/conformance/packs] }

# P5: the eval gate on release is off for the suite (cases that release an edit would otherwise
# need a passing golden set); release_gate turns it on.
release: { gate: { enabled: false } }

overridable:
  - context.stores
  - loop.max_steps
  - loop.stuck_repeats
  - loop.final_call_on_exit
  - approval.timeout_s
  - input_guardrails.size.max_chars
  - input_guardrails.injection.block_threshold
  - policy.budgets.default.tool_calls_per_turn
  - release.gate.enabled
  - public.models                    # P6: the public allowlist, its default and the budget
  - public.default_model
  - public.hosted_budget_usd_per_day
